<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px">
    <div
      style="
        max-width: 500px;
        margin: auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
      "
    >
      <h2 style="color: #2563eb">Forgot Password Request</h2>

      <p>Your password reset token is:</p>

      <h2
        style="
          background: #f3f4f6;
          padding: 12px;
          border-radius: 6px;
          letter-spacing: 2px;
          word-break: break-all;
        "
      >
        {{resetToken}}
      </h2>

      <p>Use this token in the reset password API.</p>
    </div>
  </body>
</html>
